<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вопросы для записи</title>
<style>
  :root { --bg:#0f1115; --text:#f2f2f2; --muted:#9aa0aa; --accent:#c6f432; --card:#1a1d24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid #2a2e37; }
  header b { margin-right:auto; }
  button { background:var(--card); color:var(--text); border:1px solid #333a46; border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; }
  button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  .hint { padding:12px 16px; color:var(--muted); font-size:16px; }
  .big { padding:6vh 16px; text-align:center; min-height:56vh; display:flex; flex-direction:column; justify-content:center; }
  .num { color:var(--accent); font-size:clamp(22px,4vw,34px); font-weight:700; }
  .q { font-size:clamp(28px,5.5vw,58px); font-weight:700; line-height:1.2; max-width:1100px; margin:16px auto 0; }
  .nav { display:flex; justify-content:center; gap:12px; padding:0 16px 24px; }
  ol { max-width:900px; margin:0 auto; padding:0 16px 48px 48px; }
  li { margin:8px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <b id="title">Вопросы для записи</b>
  <button id="ru" class="on">Русский</button>
  <button id="ky">Кыргызча</button>
  <button id="mode">Весь список</button>
</header>
<div class="hint" id="hint"></div>
<div id="one">
  <div class="big"><div class="num" id="num"></div><div class="q" id="q"></div></div>
  <div class="nav"><button id="prev">← Назад</button><button id="next">Дальше → (пробел)</button></div>
</div>
<ol id="all" class="hidden"></ol>
<script>
const Q = {
ru: [
 "Как тебя зовут, из какого ты города? Чем занимаешься — одной фразой, как сказал бы соседу.",
 "Как ты пришёл в это дело? 3–5 поворотов: где учился, где работал, что бросил, что изменилось.",
 "Какие цифры можешь показать? Годы опыта, ученики, клиенты, результаты, подписчики.",
 "Во что ты веришь в своём деле? С чем в нише не согласен, что все делают неправильно?",
 "Что из жизни можно показывать, а что никогда: семью, детей, веру, деньги, лица близких?",
 "Вспомни трёх последних клиентов или учеников. Кто они: возраст, занятие, город?",
 "С какой проблемой они пришли? Скажи их словами, как они писали или говорили.",
 "Чего они хотят через 3 месяца?",
 "Почему люди спрашивают, но не покупают? Что они говорят?",
 "Что у тебя можно купить, от дешёвого к дорогому? Цена, формат. Есть ли бесплатное?",
 "Главный продукт: какой результат получает человек и за какой срок? Кому он не подходит?",
 "Как сейчас у тебя покупают: что человек пишет, куда переходит, как платит?",
 "Что человек получит, если подпишется на тебя? Одной фразой.",
 "Чем ты отличаешься от трёх соседей по нише? Факт, а не «я лучше».",
 "О чём ты можешь говорить годами? Назови 3–5 тем.",
 "О чём ты не будешь говорить никогда? Темы, слова, обещания.",
 "Как ты говоришь: любимые слова, шутки, присказки? Какие слова ты никогда не скажешь?",
 "Где ты ведёшь блог: ник, язык, сколько подписчиков? Сколько роликов в неделю реально выпустишь?",
 "Сколько хочешь зарабатывать на этом через месяц и через 3 месяца? Цифрой.",
 "Расскажи про один свой провал в деле и что ты из него вынес.",
 "Расскажи про ученика или клиента, у которого получилось: каким был до, что сделали, что стало.",
 "Какую сцену из твоей работы зритель узнает сразу? Обычный день, частый вопрос, смешной случай."
],
ky: [
 "Атың ким, кайсы шаардансың? Эмне менен алектенесиң — кошунаңа айткандай, бир сүйлөм менен.",
 "Бул ишке кантип келдиң? 3–5 бурулуш: кайда окудуң, кайда иштедиң, эмнени таштадың, эмне өзгөрдү.",
 "Кандай цифраларды көрсөтө аласың? Тажрыйба жылдары, окуучулар, кардарлар, натыйжалар, жазылуучулар.",
 "Ишиңде эмнеге ишенесиң? Тармагыңда эмнеге макул эмессиң, көпчүлүк эмнени туура эмес кылат?",
 "Жашооңдон эмнени көрсөтсө болот, эмнени эч качан көрсөтпөйсүң: үй-бүлө, балдар, дин, акча, жакындардын жүзү?",
 "Акыркы үч кардарыңды же окуучуңду эстечи. Алар кимдер: жашы, иши, шаары?",
 "Алар кандай көйгөй менен келишти? Өз сөздөрү менен, кандай жазышса ошондой айтып берчи.",
 "Үч айдан кийин алар эмнени каалашат?",
 "Эмне үчүн адамдар сурашат, бирок сатып алышпайт? Эмне дешет?",
 "Сенден эмнени сатып алса болот, арзанынан кымбатына чейин? Баасы, форматы. Акысыз нерсе барбы?",
 "Негизги продукт: адам кандай натыйжа алат, канча убакытта? Ал кимге туура келбейт?",
 "Азыр сенден кантип сатып алышат: адам эмне жазат, кайда өтөт, кантип төлөйт?",
 "Сага жазылган адам эмне алат? Бир сүйлөм менен.",
 "Тармактагы үч кошунаңдан эмнең менен айырмаланасың? «Мен мыктымын» эмес, факт менен.",
 "Кайсы темалар жөнүндө жылдар бою сүйлөй аласың? 3–5 тема айт.",
 "Эмне жөнүндө эч качан сүйлөбөйсүң? Темалар, сөздөр, убадалар.",
 "Сен кантип сүйлөйсүң: сүйүктүү сөздөрүң, тамашаларың? Кайсы сөздөрдү эч качан айтпайсың?",
 "Блогуң кайда: ник, тил, канча жазылуучу? Жумасына чындап канча ролик чыгара аласың?",
 "Бир айдан жана үч айдан кийин мындан канча тапкың келет? Цифра менен айт.",
 "Ишиңдеги бир ийгиликсиздикти жана андан эмне үйрөнгөнүңдү айтып берчи.",
 "Ийгиликке жеткен окуучуң же кардарың жөнүндө айтчы: башында кандай эле, эмне кылдыңар, эмне болду?",
 "Ишиңден көрүүчү дароо тааный турган бир көрүнүш: кадимки күн, көп берилген суроо, күлкүлүү окуя."
]};
const T = {
 ru: { hint: "Включи запись и отвечай по порядку. Перед ответом скажи номер: «Вопрос один», «Вопрос два»… Не знаешь ответа — скажи «пропускаю». Можно с паузами, можно частями.",
       title: "Вопросы для записи", num: "Вопрос", all: "Весь список", one: "По одному", prev: "← Назад", next: "Дальше → (пробел)" },
 ky: { hint: "Жазууну күйгүз да, ирети менен жооп бер. Жооптун алдында номерин айт: «Биринчи суроо», «Экинчи суроо»… Билбесең — «өткөрөм» де. Тыныгуу менен, бөлүп-бөлүп айтсаң да болот.",
       title: "Жазуу үчүн суроолор", num: "Суроо", all: "Толук тизме", one: "Бирден", prev: "← Артка", next: "Кийинки → (боштук)" }
};
let lang = "ru", i = 0, list = false;
const $ = id => document.getElementById(id);
function draw() {
  const t = T[lang], q = Q[lang];
  $("title").textContent = t.title; $("hint").textContent = t.hint;
  $("num").textContent = t.num + " " + (i + 1) + " / " + q.length; $("q").textContent = q[i];
  $("prev").textContent = t.prev; $("next").textContent = t.next;
  $("mode").textContent = list ? t.one : t.all;
  $("all").innerHTML = q.map((x, n) => "<li><b>" + t.num + " " + (n + 1) + ".</b> " + x + "</li>").join("");
  $("one").classList.toggle("hidden", list); $("all").classList.toggle("hidden", !list);
  $("ru").classList.toggle("on", lang === "ru"); $("ky").classList.toggle("on", lang === "ky");
  document.documentElement.lang = lang;
}
$("ru").onclick = () => { lang = "ru"; draw(); };
$("ky").onclick = () => { lang = "ky"; draw(); };
$("mode").onclick = () => { list = !list; draw(); };
$("prev").onclick = () => { i = Math.max(0, i - 1); draw(); };
$("next").onclick = () => { i = Math.min(Q[lang].length - 1, i + 1); draw(); };
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); $("next").click(); }
  if (e.code === "ArrowLeft") $("prev").click();
});
if (location.hash === "#ky") lang = "ky";
draw();
</script>
</body>
</html>
